name: Bug report
description: Report unexpected controller behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please download integration diagnostics and redact anything else you consider private.
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior and reproducible steps.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics and relevant logs
      render: text
