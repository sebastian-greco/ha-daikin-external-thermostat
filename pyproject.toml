[project]
name = "ha-daikin-external-thermostat"
version = "1.1.0"
description = "Event-driven Home Assistant climate controller using an external temperature sensor"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Sebastian Greco" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.14",
]

[dependency-groups]
dev = [
  "mypy>=1.17",
  "pytest>=9.0",
  "pytest-homeassistant-custom-component==0.13.348",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = [
  "ANN401",
  "COM812",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "PLR2004", "S101", "SLF001"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
